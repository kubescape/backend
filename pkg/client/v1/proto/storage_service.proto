syntax = "proto3";

package storageserver.v1;

option go_package = "github.com/kubescape/backend/pkg/client/v1/proto";

import "github.com/kubescape/storage/pkg/apis/softwarecomposition/v1beta1/generated.proto";

// StorageService provides gRPC endpoints for node agent to communicate with backend storage
service StorageService {
  // SendContainerProfile receives a container profile (time-series snapshot) from node agent
  // and sends it to Pulsar for processing by the ingester
  rpc SendContainerProfile(SendContainerProfileRequest) returns (SendContainerProfileResponse);

  // GetProfile retrieves an aggregated profile (ApplicationProfile, NetworkNeighborhood,
  // or ContainerProfile) by fetching them from S3
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);

  // ListApplicationProfiles lists all ApplicationProfiles in a namespace (returns metadata only, nil Spec)
  rpc ListApplicationProfiles(ListApplicationProfilesRequest) returns (ListApplicationProfilesResponse);

  // ListNetworkNeighborhoods lists all NetworkNeighborhoods in a namespace (returns metadata only, nil Spec)
  rpc ListNetworkNeighborhoods(ListNetworkNeighborhoodsRequest) returns (ListNetworkNeighborhoodsResponse);

  // PutSBOM uploads an SBOM produced for an image. Idempotent on
  // (customer_guid, image_digest, syft_version) — duplicate calls upsert the
  // metadata row and overwrite the S3 blob; end-state is consistent. Used
  // for SBOM payloads up to the default 4 MiB gRPC message limit.
  rpc PutSBOM(PutSBOMRequest) returns (PutSBOMResponse);

  // PutSBOMStream uploads an SBOM larger than the default 4 MiB unary gRPC
  // message limit, chunked client-side. The first chunk in the stream MUST
  // set metadata (image_digest, syft_version, source); subsequent chunks
  // set only blob_chunk. Concatenated chunks form the serialized SBOMSyft
  // proto payload.
  rpc PutSBOMStream(stream PutSBOMChunk) returns (PutSBOMResponse);

  // GetSBOM probes for or fetches an SBOM by (customer_guid, image_digest,
  // syft_version). Set metadata_only=true to skip transferring the blob —
  // used by agents to decide whether to regenerate. Returns the same
  // envelope (with exists=false) on a miss.
  rpc GetSBOM(GetSBOMRequest) returns (GetSBOMResponse);

  // GetSBOMStream returns an SBOM larger than the default 4 MiB unary gRPC
  // message limit, server-streamed. The first chunk sets metadata + status;
  // subsequent chunks set only blob_chunk. The metadata_only flag on the
  // request is ignored — GetSBOM (unary) is the metadata-only entry point.
  rpc GetSBOMStream(GetSBOMRequest) returns (stream GetSBOMChunk);
}

// SendContainerProfileRequest contains the container profile to be stored
// customer_guid, cluster, host_type, and host_id are sent via gRPC metadata headers
message SendContainerProfileRequest {
  // ContainerProfile is the time-series container profile from node agent
  github.com.kubescape.storage.pkg.apis.softwarecomposition.v1beta1.ContainerProfile container_profile = 1;
}

// SendContainerProfileResponse indicates success or failure of the operation
message SendContainerProfileResponse {
  // Success indicates if the profile was successfully sent to Pulsar
  bool success = 1;

  // Error message if the operation failed
  string error_message = 2;

  // Error code for programmatic error handling
  ErrorCode error_code = 3;
}

// GetProfileRequest requests an aggregated profile
// customer_guid, cluster, host_type, and host_id are sent via gRPC metadata headers
message GetProfileRequest {
  // Kind specifies the type of profile: "applicationProfile", "networkNeighborhood", or "containerProfile"
  string kind = 1;

  // Namespace of the workload (k8s scope identifier)
  string namespace = 2;

  // Name of the workload
  string name = 3;

  // Region of the resource (non-k8s scope identifier, e.g. "us-east-1")
  string region = 4;

  // CloudAccountIdentifier of the resource (non-k8s scope identifier, e.g. AWS account ID "123456789012", GCP project ID)
  string cloud_account_identifier = 5;
}

// GetProfileResponse contains the aggregated profile
message GetProfileResponse {
  // Success indicates if the profile was successfully retrieved
  bool success = 1;

  // Error message if the operation failed
  string error_message = 2;

  // Error code for programmatic error handling
  ErrorCode error_code = 3;

  // ApplicationProfile is populated when kind is "applicationProfile"
  github.com.kubescape.storage.pkg.apis.softwarecomposition.v1beta1.ApplicationProfile application_profile = 4;

  // NetworkNeighborhood is populated when kind is "networkNeighborhood"
  github.com.kubescape.storage.pkg.apis.softwarecomposition.v1beta1.NetworkNeighborhood network_neighborhood = 5;

  // ContainerProfile is populated when kind is "containerProfile"
  github.com.kubescape.storage.pkg.apis.softwarecomposition.v1beta1.ContainerProfile container_profile = 6;
}

// ErrorCode provides specific error types for programmatic handling
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_UNAUTHORIZED = 2;
  ERROR_CODE_PROFILE_TOO_LARGE = 3;
  ERROR_CODE_PROFILE_COMPLETED = 4;
  ERROR_CODE_PROFILE_NOT_FOUND = 5;
  ERROR_CODE_INTERNAL_ERROR = 6;
  ERROR_CODE_PULSAR_ERROR = 7;
  ERROR_CODE_SBOM_NOT_FOUND = 8;
  ERROR_CODE_SBOM_TOO_LARGE = 9;
}

// SBOMSource identifies how an SBOM entered the backend.
enum SBOMSource {
  SBOM_SOURCE_UNSPECIFIED = 0;
  // SBOM_SOURCE_WORKLOAD: generated by node-agent for an in-cluster workload image.
  SBOM_SOURCE_WORKLOAD = 1;
  // SBOM_SOURCE_REGISTRY: generated by kubevuln for a registry image (Registry Epic).
  SBOM_SOURCE_REGISTRY = 2;
  // SBOM_SOURCE_HOST: generated by the host scanner for an EC2 host snapshot.
  SBOM_SOURCE_HOST = 3;
}

// ListApplicationProfilesRequest requests a list of ApplicationProfiles in a namespace
// customer_guid, cluster, host_type, and host_id are sent via gRPC metadata headers
message ListApplicationProfilesRequest {
  // Namespace to list profiles from
  string namespace = 1;

  // Limit number of items to return (0 means server default)
  int64 limit = 4;

  // Continue token for pagination
  string cont = 5;

  // Region of the resource (non-k8s scope identifier, e.g. "us-east-1")
  string region = 6;

  // CloudAccountIdentifier of the resource (non-k8s scope identifier, e.g. AWS account ID "123456789012", GCP project ID)
  string cloud_account_identifier = 7;
}

// ListApplicationProfilesResponse contains the list of ApplicationProfiles (with nil Spec)
message ListApplicationProfilesResponse {
  // Success indicates if the list was successfully retrieved
  bool success = 1;

  // Error message if the operation failed
  string error_message = 2;

  // Error code for programmatic error handling
  ErrorCode error_code = 3;

  // ApplicationProfiles list (Spec will be nil for each item)
  repeated github.com.kubescape.storage.pkg.apis.softwarecomposition.v1beta1.ApplicationProfile application_profiles = 4;

  // Continue token for next page (empty if no more results)
  string cont = 5;
}

// ListNetworkNeighborhoodsRequest requests a list of NetworkNeighborhoods in a namespace
// customer_guid, cluster, host_type, and host_id are sent via gRPC metadata headers
message ListNetworkNeighborhoodsRequest {
  // Namespace to list neighborhoods from
  string namespace = 1;

  // Limit number of items to return (0 means server default)
  int64 limit = 4;

  // Continue token for pagination
  string cont = 5;

  // Region of the resource (non-k8s scope identifier, e.g. "us-east-1")
  string region = 6;

  // CloudAccountIdentifier of the resource (non-k8s scope identifier, e.g. AWS account ID "123456789012", GCP project ID)
  string cloud_account_identifier = 7;
}

// ListNetworkNeighborhoodsResponse contains the list of NetworkNeighborhoods (with nil Spec)
message ListNetworkNeighborhoodsResponse {
  // Success indicates if the list was successfully retrieved
  bool success = 1;

  // Error message if the operation failed
  string error_message = 2;

  // Error code for programmatic error handling
  ErrorCode error_code = 3;

  // NetworkNeighborhoods list (Spec will be nil for each item)
  repeated github.com.kubescape.storage.pkg.apis.softwarecomposition.v1beta1.NetworkNeighborhood network_neighborhoods = 4;

  // Continue token for next page (empty if no more results)
  string cont = 5;
}

// PutSBOMRequest uploads an SBOM blob plus the keys identifying it.
// customer_guid, cluster, host_type, and host_id are sent via gRPC metadata
// headers (see the AuthInterceptor on the server side). The unary path is
// intended for SBOMs up to ~4 MiB; use PutSBOMStream for larger payloads.
message PutSBOMRequest {
  // image_digest is the SHA-256 digest of the scanned image (without the
  // "sha256:" prefix). Part of the primary key.
  string image_digest = 1;

  // syft_version is the version of syft that produced the blob. Part of the
  // primary key — multiple syft versions can coexist for one
  // (customer_guid, image_digest) during gradual fleet upgrades.
  string syft_version = 2;

  // source identifies how this SBOM was produced.
  SBOMSource source = 3;

  // sbom is the SBOM payload as a SBOMSyft K8s resource (the same shape
  // produced by syft + v1beta1.StripSBOM in node-agent / kubevuln).
  github.com.kubescape.storage.pkg.apis.softwarecomposition.v1beta1.SBOMSyft sbom = 4;
}

// PutSBOMResponse indicates success or failure of the operation. S3 +
// Postgres persistence happens asynchronously via Pulsar; success here
// means the upload was accepted and the Pulsar message was published.
message PutSBOMResponse {
  bool success = 1;
  string error_message = 2;
  ErrorCode error_code = 3;
}

// PutSBOMChunk is a single chunk of a streamed SBOM upload. The first
// chunk in the stream MUST set metadata. Subsequent chunks set only
// blob_chunk. Concatenated blob_chunk values form the serialized SBOMSyft
// proto payload.
message PutSBOMChunk {
  // metadata is set on the first chunk only.
  PutSBOMChunkMetadata metadata = 1;

  // blob_chunk is a slice of the serialized SBOMSyft payload.
  bytes blob_chunk = 2;
}

// PutSBOMChunkMetadata is the metadata header sent on the first chunk of a
// PutSBOMStream call.
message PutSBOMChunkMetadata {
  string image_digest = 1;
  string syft_version = 2;
  SBOMSource source = 3;
}

// GetSBOMRequest probes for or fetches an SBOM by primary key.
// customer_guid is sent via gRPC metadata headers.
message GetSBOMRequest {
  // image_digest is the SHA-256 digest of the requested image (without the
  // "sha256:" prefix).
  string image_digest = 1;

  // syft_version is the syft version that produced the requested SBOM. The
  // (image_digest, syft_version) pair is the lookup key. Leave empty to
  // request "latest available version" semantics; the server returns the
  // most recently created SBOM for the image.
  string syft_version = 2;

  // metadata_only skips the blob and returns only SBOMMetadata. Used by
  // agents to decide whether to regenerate.
  bool metadata_only = 3;
}

// GetSBOMResponse returns the SBOM (or just metadata).
message GetSBOMResponse {
  bool success = 1;
  string error_message = 2;
  ErrorCode error_code = 3;

  // exists indicates whether an SBOM row was found for the requested key.
  // When false, success is still true and metadata + sbom are empty.
  bool exists = 4;

  // metadata is populated whenever exists=true.
  SBOMMetadata metadata = 5;

  // sbom is populated only when exists=true and metadata_only was false on
  // the request.
  github.com.kubescape.storage.pkg.apis.softwarecomposition.v1beta1.SBOMSyft sbom = 6;
}

// GetSBOMChunk is a single chunk of a streamed SBOM download. The first
// chunk sets metadata + status; subsequent chunks set only blob_chunk.
message GetSBOMChunk {
  // metadata is set on the first chunk only.
  GetSBOMChunkMetadata metadata = 1;

  // blob_chunk is a slice of the serialized SBOMSyft payload.
  bytes blob_chunk = 2;
}

// GetSBOMChunkMetadata is the status header sent on the first chunk of a
// GetSBOMStream call. If exists=false or success=false the server closes
// the stream without sending blob chunks.
message GetSBOMChunkMetadata {
  bool success = 1;
  string error_message = 2;
  ErrorCode error_code = 3;
  bool exists = 4;
  SBOMMetadata sbom_metadata = 5;
}

// SBOMMetadata is the indexed view of an SBOM row, returned by GetSBOM
// with or without metadata_only=true.
message SBOMMetadata {
  // image_digest of the scanned image (without the "sha256:" prefix).
  string image_digest = 1;

  // syft_version that produced the SBOM blob.
  string syft_version = 2;

  // source identifies how this SBOM was produced.
  SBOMSource source = 3;

  // blob_size_bytes is the size of the SBOM blob in S3.
  int64 blob_size_bytes = 4;

  // created_at is the RFC3339 timestamp when the row was first inserted.
  string created_at = 5;

  // last_referenced_at is the RFC3339 timestamp when the orchestrator most
  // recently resolved an inventory entry to this SBOM. Drives eviction.
  string last_referenced_at = 6;
}
